<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>리볼버 러시안 룰렛 락앤로드! 🔫</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container" id="mainContainer">
        <h1>🔫 리볼버 러시안 룰렛</h1>
        
        <div class="input-section">
            <label>벌칙 항목 입력 (쉼표로 구분):</label>
            <textarea id="penaltyInput" placeholder="콰당 댄스, 멜론차트 1등곡 부르기, 제자리점프 10회, 통과!, 통과!, 통과!">콰당 댄스, 멜론차트 1등곡 부르기, 제자리점프 10회, 통과!, 통과!, 통과!</textarea>
        </div>

        <div class="pointer"></div>
        <div class="revolver-cylinder" id="cylinder">
            <div class="chamber"></div>
            <div class="chamber"></div>
            <div class="chamber"></div>
            <div class="chamber"></div>
            <div class="chamber"></div>
            <div class="chamber"></div>
        </div>

        <div class="bullet-counter" id="bulletCounter">남은 총알: 6 / 6 발</div>
        <div class="status-display" id="statusText">준비 완료. 방아쇠를 당기세요!</div>
        <div class="result-display" id="resultText"></div>

        <button class="btn" id="shootBtn" onclick="pullTrigger()">방아쇠 당기기</button>
        <button class="btn reload-btn" id="reloadBtn" onclick="reloadRevolver()">재장전</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
