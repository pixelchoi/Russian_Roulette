<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>리볼버 러시안 룰렛 🎰</title>
    <style>
        :root {
            --bg-color: #1e1e24;
            --panel-color: #2a2a35;
            --accent-color: #ff4757;
            --safe-color: #2ed573;
            --gold-color: #ffa502;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        /* 화면 흔들림 애니메이션 (당첨 시) */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(0px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(2px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(2px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        .shake-effect {
            animation: shake 0.5s;
            animation-iteration-count: infinite;
        }

        .container {
            background-color: var(--panel-color);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            width: 90%;
            max-width: 500px;
            transition: all 0.3s ease;
        }

        h1 {
            margin-top: 0;
            font-size: 24px;
            color: var(--gold-color);
        }

        /* 입력 영역 */
        .input-section {
            margin-bottom: 25px;
        }

        textarea {
            width: 100%;
            height: 60px;
            background-color: #15151a;
            border: 2px solid #444;
            border-radius: 10px;
            color: white;
            padding: 10px;
            box-sizing: border-box;
            resize: none;
            font-size: 14px;
        }

        textarea:focus {
            border-color: var(--gold-color);
            outline: none;
        }

        /* 리볼버 탄창 UI */
        .revolver-cylinder {
            width: 160px;
            height: 160px;
            border: 6px solid #555;
            border-radius: 50%;
            margin: 20px auto;
            position: relative;
            background: #3a3a4a;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
        }

        /* 총알 구멍 6개 */
        .chamber {
            width: 32px;
            height: 32px;
            background-color: #15151a;
            border-radius: 50%;
            position: absolute;
            border: 2px solid #666;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        /* 6발 위치 고정 계산 */
        .chamber:nth-child(1) { top: 10px; left: 64px; }   /* 12시 (발사 위치) */
        .chamber:nth-child(2) { top: 37px; left: 112px; }  /* 2시 */
        .chamber:nth-child(3) { top: 93px; left: 112px; }  /* 4시 */
        .chamber:nth-child(4) { top: 120px; left: 64px; }  /* 6시 */
        .chamber:nth-child(5) { top: 93px; left: 16px; }   /* 8시 */
        .chamber:nth-child(6) { top: 37px; left: 16px; }   /* 10시 */

        /* 장전된 총알 상태 표시 (금색 화력) */
        .chamber.loaded {
            background: radial-gradient(circle, var(--gold-color) 40%, #b8860b 80%);
            border-color: #fff;
        }
        
        /* 이미 발사된 빈 조각 */
        .chamber.fired {
            background-color: #222;
            border-color: #333;
            opacity: 0.4;
        }

        /* 발사 인디케이터 (현재 격발 위치 표시) */
        .pointer {
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 15px solid var(--accent-color);
            margin: -10px auto 10px auto;
        }

        /* 정보창 및 상태 */
        .status-display {
            font-size: 18px;
            font-weight: bold;
            margin: 15px 0;
            height: 24px;
        }

        .result-display {
            font-size: 32px;
            font-weight: 900;
            margin: 20px 0;
            min-height: 45px;
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .bullet-counter {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 20px;
        }

        /* 제어 버튼 */
        .btn {
            background-color: var(--gold-color);
            color: #000;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 5px 15px rgba(255, 165, 0, 0.3);
            margin: 5px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(255, 165, 0, 0.4);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn.reload-btn {
            background-color: #555;
            color: white;
            box-shadow: none;
        }
        
        .btn.reload-btn.active {
            background-color: var(--safe-color);
            color: black;
            box-shadow: 0 5px 15px rgba(46, 213, 115, 0.3);
        }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <h1>🔫 리볼버 러시안 룰렛</h1>
        
        <div class="input-section">
            <label style="display:block; text-align:left; margin-bottom:5px; font-size:13px; color:#aaa;">벌칙 항목 입력 (쉼표로 구분):</label>
            <textarea id="penaltyInput" placeholder="콰당 댄스, 멜론차트 1등곡 부르기, 제자리점프 10회, 통과!, 통과!, 통과!">콰당 댄스, 멜론차트 1등곡 부르기, 제자리점프 10회, 통과!, 통과!, 통과!</textarea>
        </div>

        <div class="pointer"></div>
        <div class="revolver-cylinder" id="cylinder">
            <div class="chamber"></div>
            <div class="chamber"></div>
            <div class="chamber"></div>
            <div class="chamber"></div>
            <div class="chamber"></div>
            <div class="chamber"></div>
        </div>

        <div class="bullet-counter" id="bulletCounter">남은 총알: 6 / 6 발</div>
        <div class="status-display" id="statusText">준비 완료. 방아쇠를 당기세요!</div>
        <div class="result-display" id="resultText"></div>

        <button class="btn" id="shootBtn" onclick="pullTrigger()">방아쇠 당기기</button>
        <button class="btn reload-btn" id="reloadBtn" onclick="reloadRevolver()">재장전</button>
    </div>

    <script>
        // 게임 상태 상태 변수들
        let penalties = [];
        let totalChambers = 6;
        let currentShotCount = 0; // 현재까지 쏜 횟수
        let cylinderRotation = 0; // 탄창 회전 각도
        let isGameOver = false;

        const cylinder = document.getElementById('cylinder');
        const chambers = document.querySelectorAll('.chamber');
        const penaltyInput = document.getElementById('penaltyInput');
        const resultText = document.getElementById('resultText');
        const statusText = document.getElementById('statusText');
        const bulletCounter = document.getElementById('bulletCounter');
        const mainContainer = document.getElementById('mainContainer');
        const reloadBtn = document.getElementById('reloadBtn');
        const shootBtn = document.getElementById('shootBtn');

        // 입력 텍스트 바탕으로 벌칙 셋팅 및 셔플(재배치)
        function initGame() {
            // 입력값 파싱 (공백 제거)
            let items = penaltyInput.value.split(',').map(item => item.trim()).filter(item => item !== "");
            
            // 6개 채우기 메커니즘 (부족하면 '통과!'로 채우고, 넘치면 6개만 사용)
            penalties = [...items];
            while(penalties.length < 6) {
                penalties.push("통과!");
            }
            if(penalties.length > 6) {
                penalties = penalties.slice(0, 6);
            }

            // 배열 랜덤하게 섞기 (러시안 룰렛의 무작위성)
            for (let i = penalties.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [penalties[i], penalties[j]] = [penalties[j], penalties[i]];
            }

            // UI 초기화
            currentShotCount = 0;
            isGameOver = false;
            resultText.innerText = "";
            resultText.style.color = "white";
            statusText.innerText = "새 탄창이 장전되었습니다!";
            statusText.style.color = "white";
            bulletCounter.innerText = `남은 총알: 6 / 6 발`;
            reloadBtn.classList.remove('active');
            shootBtn.disabled = false;

            chambers.forEach((chamber, index) => {
                chamber.className = 'chamber loaded'; // 전부 금빛 총알 충전
            });
        }

        // 방아쇠 당기기
        function pullTrigger() {
            if (isGameOver) return;

            // 6발 다 쐈을 때 예외 처리 및 재장전 유도
            if (currentShotCount >= totalChambers) {
                statusText.innerText = "탄창이 비었습니다! 재장전을 하세요.";
                statusText.style.color = var(--accent-color);
                return;
            }

            // 1. 탄창 회전 연출 (한 칸씩 회전 = 60도씩)
            cylinderRotation += 60;
            cylinder.style.transform = `rotate(${cylinderRotation}deg)`;

            // 현재 쏠 칸의 인덱스 (12시 방향에 오는 칸 계산)
            // 회전 방향에 맞추어 역순 계산 처리
          
            let currentChamberIndex = (6 - (currentShotCount % 6)) % 6;
        
        // 2. 격발 연출 타이밍 (애니메이션 매칭을 위해 잠깐 대기)
        setTimeout(() => {
            let currentResult = penalties[currentShotCount];
            
            // 해당 위치 탄창 빈 공간 처리
            chambers[currentChamberIndex].classList.remove('loaded');
            chambers[currentChamberIndex].classList.add('fired');
            
            currentShotCount++;
            bulletCounter.innerText = `남은 총알: ${6 - currentShotCount} / 6 발`;

            // 3. 당첨 및 생존 판정 (여기서는 '통과!'가 아니면 전부 쾅! 벌칙 당첨으로 간주)
            if (currentResult !== "통과!") {
                // 💥 당첨! (피 대신 화면 진동 및 거대 폭발 텍스트 연출)
                isGameOver = true;
                shootBtn.disabled = true;
                statusText.innerText = "🚨 격발 완료! 벌칙 당첨! 🚨";
                statusText.style.color = 'var(--accent-color)';
                
                resultText.innerText = `💥 BANG! [${currentResult}]`;
                resultText.style.color = 'var(--accent-color)';
                
                // 진동 이펙트 켜기
                mainContainer.classList.add('shake-effect');
                setTimeout(() => {
                    mainContainer.classList.remove('shake-effect');
                }, 600);

                // 게임오버 직후 재장전 버튼 하이라이트
                reloadBtn.classList.add('active');

            } else {
                // 찰칵 - 생존
                statusText.innerText = "...찰칵! 빈 총성이 울렸습니다.";
                statusText.style.color = 'var(--safe-color)';
                resultText.innerText = "세이프! 😮";
                resultText.style.color = 'var(--safe-color)';

                // 6발을 다 무사히 쐈을 경우 자동 장전 모드 유도
                if (currentShotCount === totalChambers) {
                    statusText.innerText = "휴... 6발을 모두 버텼습니다! 재장전하세요.";
                    reloadBtn.classList.add('active');
                }
            }
        }, 250);
    }

    // 재장전 모션 구현
    function reloadRevolver() {
        // 완전 한바퀴 휘리릭 돌리는 연출용 각도 추가
        cylinderRotation += 360;
        cylinder.style.transform = `rotate(${cylinderRotation}deg)`;
        
        statusText.innerText = "딸깍딸깍... 탄창 비우고 새로 장전 중...";
        
        // 장전 바퀴 도는 시간 뒤에 데이터 갱신
        setTimeout(() => {
            initGame();
        }, 400);
    }

    // 입력창 내용 바뀔 때 실시간 반영될 수 있도록 감지 리스너
    penaltyInput.addEventListener('change', () => {
        if(currentShotCount === 0) initGame();
    });

    // 페이지 최초 로드 시 게임 초기화
    window.onload = initGame;
